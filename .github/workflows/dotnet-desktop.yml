name: .NET Core Desktop (build & test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-latest

    env:
      DOTNET_PROJECT_PATH: src/cs/RemoteControl.csproj
      # If you have a WAP packaging project, set WAP_PROJECT_PATH and Base64_Encoded_Pfx secret, otherwise leave empty.
      WAP_PROJECT_PATH: ""   # e.g. src/cs/MyApp.Package/MyApp.Package.wapproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore ${{ env.DOTNET_PROJECT_PATH }}

    - name: Build
      run: dotnet build ${{ env.DOTNET_PROJECT_PATH }} --configuration ${{ matrix.configuration }} --no-restore

    - name: Test
      run: |
        # Run tests if test projects exist. Adjust glob if you have dedicated test projects.
        # Option A: test the main project (if it contains tests)
        dotnet test ${{ env.DOTNET_PROJECT_PATH }} --configuration ${{ matrix.configuration }} --no-build || echo "dotnet test returned non-zero (no tests or failed)."

        # Option B (recommended if you have separate test projects):
        # dotnet test ./src/cs/**/*.Tests.csproj --configuration ${{ matrix.configuration }} --no-build

    # Optional: Windows App Packaging (MSIX) - only run if WAP_PROJECT_PATH is set
    - name: Create app package (WAP)
      if: ${{ env.WAP_PROJECT_PATH != '' }}
      run: |
        msbuild ${{ env.WAP_PROJECT_PATH }} /p:Configuration=${{ matrix.configuration }} /p:UapAppxPackageBuildMode=${{ env.Appx_Package_Build_Mode }}
      env:
        Appx_Package_Build_Mode: StoreUpload

    # Optional: cleanup secrets / artifacts steps here (only relevant if WAP used)
